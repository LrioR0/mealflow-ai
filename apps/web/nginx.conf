# 每个来源 IP 一条的 Agent 接口限速区：对话流会触发云端模型调用与外部站点
# （下厨房）抓取，限定速率可防止脚本刷接口或把本服务滥用为对外抓取代理。
# 30r/m + burst 10 对真人家庭使用无感，但足以拦住自动化滥用。
limit_req_zone $binary_remote_addr zone=agent_api:10m rate=30r/m;

server {
  listen 80;
  server_name _;

  location /api/ {
    proxy_pass http://api:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Agent 接口单独挂限速（nginx 取最长前缀匹配，不影响其他 /api/ 路由）；
  # 突发允许 10 个请求，超出返回 429。SSE 长连接只计请求开始，不受流时长影响。
  location /api/v1/agent/ {
    limit_req zone=agent_api burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://api:8000/api/v1/agent/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
